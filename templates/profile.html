{% extends "base.html" %}

{% block title %}Profile — Spendly{% endblock %}

{% block content %}

<section class="legal-section">
    <div class="legal-inner">

        <h1 class="legal-title">{{ user.name }}</h1>
        <p class="legal-updated">Member since {{ user.created_at }}</p>

        <div class="auth-card">
            <div class="form-group">
                <label>Name</label>
                <p class="legal-body">{{ user.name }}</p>
            </div>
            <div class="form-group">
                <label>Email</label>
                <p class="legal-body">{{ user.email }}</p>
            </div>
        </div>

    </div>
</section>

{% endblock %}
